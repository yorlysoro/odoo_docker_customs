services:
  odoo16-enterprise:
    build:
      context: .
    container_name: odoo16-enterprise
    depends_on:
      - db16
    ports:
      - "16000:8069"
      - "5678:5678"
    volumes:
      - odoo-web16:/var/lib/odoo
      - ./config:/etc/odoo
      - ../custom_addons:/var/opt/src/custom_addons
      - ../oca_addons:/var/opt/src/oca_addons
      - ../third_party:/var/opt/src/third_party
      - ../enterprise:/var/opt/src/enterprise
    environment:
      - PYTHONUNBUFFERED=0
    #restart: always
    networks:
      - postgres_bd
  db16:
    image: postgres:16
    container_name: db16
    ports:
      - "19000:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db16:/var/lib/postgresql/data/pgdata
    #restart: always
    networks:
      - postgres_bd
  pgadmin16:
    container_name: pgadmin16
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: jdap.dmc@gmail.com
      PGADMIN_DEFAULT_PASSWORD: odoo
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - postgres_bd
    volumes:
        - pgadmin16:/root/.pgadmin

    ports:
      - "8080:80"    
    #restart: unless-stopped

networks:
  postgres_bd:

volumes:
  odoo-web16:
  odoo-db16:
  pgadmin16:
